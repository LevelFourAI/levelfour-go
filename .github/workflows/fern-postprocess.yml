name: Post-process Fern PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  postprocess:
    if: startsWith(github.head_ref, 'fern-bot/') || startsWith(github.head_ref, 'sdk-sync/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod

      - name: Verify build before post-processing
        run: go build ./...

      - name: Fix generated file headers
        run: ./scripts/fix_headers.sh

      - name: Generate type aliases
        run: ./scripts/gen_aliases.sh

      - name: Verify build and tests
        run: |
          go build ./...
          go test -race ./...

      - name: Commit post-processed files
        run: |
          git config user.name "levelfour-automation"
          git config user.email "automation@levelfour.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "No post-processing changes"
          else
            git commit -m "chore: post-process Fern generated code"
            git push
          fi
