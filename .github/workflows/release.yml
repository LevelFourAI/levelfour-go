name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.AUTOMATION_PAT || github.token }}

      - name: Trigger pkg.go.dev indexing
        if: steps.release.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.tag_name }}
        run: |
          curl -sf "https://pkg.go.dev/fetch/github.com/LevelFourAI/levelfour-go@${VERSION}" || true
          curl -sf "https://pkg.go.dev/fetch/github.com/LevelFourAI/levelfour-go/levelfour@${VERSION}" || true
