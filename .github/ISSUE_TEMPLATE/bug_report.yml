name: Bug Report
description: Report a bug in the LevelFour Go SDK
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps to reproduce the issue.
      render: go
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: "Output of: go list -m github.com/LevelFourAI/levelfour-go"
      placeholder: "github.com/LevelFourAI/levelfour-go v0.1.0"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: "Output of: go version"
      placeholder: "go version go1.24.0 linux/amd64"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: false
